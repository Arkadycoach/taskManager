<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Manager</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: #2a2a3a;
      --accent: #7c5cfc;
      --accent2: #fc5c7c;
      --green: #2dffb3;
      --yellow: #ffd166;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .app { position: relative; z-index: 1; }

    /* HEADER */
    .header {
      padding: 20px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Unbounded', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .sync-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sync-btn:hover, .sync-btn:active { border-color: var(--accent); color: var(--accent); }
    .sync-btn.syncing .sync-icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* STATS BAR */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 16px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 8px;
      text-align: center;
    }
    .stat-card .num {
      font-family: 'Unbounded', sans-serif;
      font-size: 22px;
      font-weight: 800;
    }
    .stat-card .label {
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-card.total .num { color: var(--text); }
    .stat-card.doing .num { color: var(--accent); }
    .stat-card.done .num { color: var(--green); }
    .stat-card.overdue .num { color: var(--accent2); }

    /* TABS */
    .tabs {
      display: flex;
      padding: 0 16px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 100px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* TASKS */
    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
    }
    .tasks-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .add-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }
    .add-btn:active { transform: scale(0.93); }

    .tasks-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 100px;
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .task-card:active { transform: scale(0.98); }
    .task-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 2px 0 0 2px;
    }
    .task-card.priority-high::before { background: var(--accent2); }
    .task-card.priority-medium::before { background: var(--yellow); }
    .task-card.priority-low::before { background: var(--green); }

    .task-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .task-check {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      cursor: pointer;
    }
    .task-check.checked {
      background: var(--green);
      border-color: var(--green);
    }
    .task-check.checked::after { content: '✓'; font-size: 12px; color: #000; font-weight: bold; }

    .task-content { flex: 1; min-width: 0; }
    .task-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      word-break: break-word;
    }
    .task-title.done { text-decoration: line-through; color: var(--muted); }
    .task-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 100px;
      border: 1px solid;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .badge.status-todo { color: var(--muted); border-color: var(--border); }
    .badge.status-doing { color: var(--accent); border-color: var(--accent); background: rgba(124,92,252,0.1); }
    .badge.status-done { color: var(--green); border-color: var(--green); background: rgba(45,255,179,0.1); }
    .badge.priority-high { color: var(--accent2); border-color: var(--accent2); background: rgba(252,92,124,0.1); }
    .badge.priority-medium { color: var(--yellow); border-color: var(--yellow); background: rgba(255,209,102,0.1); }
    .badge.priority-low { color: var(--green); border-color: var(--green); background: rgba(45,255,179,0.1); }

    .task-date {
      font-size: 10px;
      color: var(--muted);
      margin-left: auto;
    }
    .task-date.overdue { color: var(--accent2); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 12px; line-height: 1.6; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      padding: 24px 20px 40px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 14px; }
    .form-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: block;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
    }
    .form-textarea { resize: none; height: 80px; }
    .form-select option { background: #1a1a24; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary {
      flex: 1;
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 14px 20px;
      border-radius: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger {
      background: rgba(252,92,124,0.15);
      border: 1px solid var(--accent2);
      color: var(--accent2);
      padding: 14px 16px;
      border-radius: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 12px;
      z-index: 200;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error { border-color: var(--accent2); color: var(--accent2); }

    /* Loading */
    .loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 300;
      transition: opacity 0.5s;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading-logo {
      font-family: 'Unbounded', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 24px;
    }
    .loading-logo span { color: var(--accent); }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
<div class="loading" id="loading">
  <div class="loading-logo">TASK<span>.</span></div>
  <div class="loader"></div>
</div>

<div class="app">
  <div class="header">
    <div class="logo">TASK<span>.</span>MGR</div>
    <button class="sync-btn" onclick="syncData()" id="syncBtn">
      <span class="sync-icon">⟳</span> SYNC
    </button>
  </div>

  <div class="stats">
    <div class="stat-card total">
      <div class="num" id="statTotal">0</div>
      <div class="label">всего</div>
    </div>
    <div class="stat-card doing">
      <div class="num" id="statDoing">0</div>
      <div class="label">в работе</div>
    </div>
    <div class="stat-card done">
      <div class="num" id="statDone">0</div>
      <div class="label">готово</div>
    </div>
    <div class="stat-card overdue">
      <div class="num" id="statOverdue">0</div>
      <div class="label">просрочено</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setFilter('all', this)">Все</button>
    <button class="tab" onclick="setFilter('todo', this)">Новые</button>
    <button class="tab" onclick="setFilter('doing', this)">В работе</button>
    <button class="tab" onclick="setFilter('done', this)">Готово</button>
    <button class="tab" onclick="setFilter('high', this)">🔴 Срочные</button>
  </div>

  <div class="tasks-header">
    <span class="tasks-title" id="tasksLabel">Все задачи</span>
    <button class="add-btn" onclick="openAddModal()">+</button>
  </div>

  <div class="tasks-list" id="tasksList"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="taskModal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Новая задача</div>

    <div class="form-group">
      <label class="form-label">Название *</label>
      <input class="form-input" id="taskTitle" placeholder="Что нужно сделать?">
    </div>
    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea class="form-textarea" id="taskDesc" placeholder="Подробности..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Статус</label>
        <select class="form-select" id="taskStatus">
          <option value="todo">Новая</option>
          <option value="doing">В работе</option>
          <option value="done">Готово</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Приоритет</label>
        <select class="form-select" id="taskPriority">
          <option value="medium">Средний</option>
          <option value="high">Высокий</option>
          <option value="low">Низкий</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Дедлайн</label>
        <input class="form-input" type="date" id="taskDeadline">
      </div>
      <div class="form-group">
        <label class="form-label">Исполнитель</label>
        <input class="form-input" id="taskAssignee" placeholder="@username">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn-danger" id="deleteBtn" onclick="deleteTask()" style="display:none">Удалить</button>
      <button class="btn-primary" onclick="saveTask()">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ==========================================
  // CONFIG — замени на свои значения!
  // ==========================================
  const CONFIG = {
    API_URL: 'https://arkadycoach.github.io/taskManager/',  // URL твоего бэкенда
    POLL_INTERVAL: 30000,  // Обновление каждые 30 секунд
  };

  // Telegram WebApp init
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setBackgroundColor('#0a0a0f');
    tg.setHeaderColor('#0a0a0f');
  }

  const userId = tg?.initDataUnsafe?.user?.id || 'demo_user';
  const userName = tg?.initDataUnsafe?.user?.username || 'demo';

  let tasks = [];
  let currentFilter = 'all';
  let editingId = null;

  // ==========================================
  // API CALLS
  // ==========================================
  async function apiCall(method, endpoint, body = null) {
    try {
      const opts = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'X-User-Id': String(userId),
          'X-Init-Data': tg?.initData || '',
        }
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(CONFIG.API_URL + endpoint, opts);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      console.error('API Error:', e);
      return null;
    }
  }

  async function loadTasks() {
    const data = await apiCall('GET', `/tasks?user_id=${userId}`);
    if (data && data.tasks) {
      tasks = data.tasks;
      renderTasks();
      updateStats();
    }
  }

  async function syncData() {
    const btn = document.getElementById('syncBtn');
    btn.classList.add('syncing');
    await loadTasks();
    btn.classList.remove('syncing');
    showToast('✓ Синхронизировано', 'success');
  }

  // ==========================================
  // RENDER
  // ==========================================
  function renderTasks() {
    const list = document.getElementById('tasksList');
    let filtered = tasks;

    if (currentFilter === 'todo') filtered = tasks.filter(t => t.status === 'todo');
    else if (currentFilter === 'doing') filtered = tasks.filter(t => t.status === 'doing');
    else if (currentFilter === 'done') filtered = tasks.filter(t => t.status === 'done');
    else if (currentFilter === 'high') filtered = tasks.filter(t => t.priority === 'high');

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state">
        <div class="icon">📋</div>
        <p>Задач нет.<br>Нажми + чтобы добавить первую</p>
      </div>`;
      return;
    }

    list.innerHTML = filtered.map(task => {
      const isOverdue = task.deadline && new Date(task.deadline) < new Date() && task.status !== 'done';
      const deadlineStr = task.deadline
        ? new Date(task.deadline).toLocaleDateString('ru', { day: 'numeric', month: 'short' })
        : '';

      const statusLabels = { todo: 'Новая', doing: 'В работе', done: 'Готово' };
      const priorityLabels = { high: '🔴 Высокий', medium: '🟡 Средний', low: '🟢 Низкий' };

      return `<div class="task-card priority-${task.priority}" onclick="openEditModal('${task.id}')">
        <div class="task-top">
          <div class="task-check ${task.status === 'done' ? 'checked' : ''}"
               onclick="toggleDone(event, '${task.id}')"></div>
          <div class="task-content">
            <div class="task-title ${task.status === 'done' ? 'done' : ''}">${escHtml(task.title)}</div>
            ${task.description ? `<div class="task-desc">${escHtml(task.description)}</div>` : ''}
          </div>
        </div>
        <div class="task-meta">
          <span class="badge status-${task.status}">${statusLabels[task.status]}</span>
          <span class="badge priority-${task.priority}">${priorityLabels[task.priority]}</span>
          ${task.assignee ? `<span class="badge" style="color:var(--muted);border-color:var(--border)">${escHtml(task.assignee)}</span>` : ''}
          ${deadlineStr ? `<span class="task-date ${isOverdue ? 'overdue' : ''}">${isOverdue ? '⚠ ' : ''}${deadlineStr}</span>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = tasks.length;
    document.getElementById('statDoing').textContent = tasks.filter(t => t.status === 'doing').length;
    document.getElementById('statDone').textContent = tasks.filter(t => t.status === 'done').length;
    const overdue = tasks.filter(t => t.deadline && new Date(t.deadline) < new Date() && t.status !== 'done').length;
    document.getElementById('statOverdue').textContent = overdue;
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const labels = { all: 'Все задачи', todo: 'Новые задачи', doing: 'В работе', done: 'Выполненные', high: 'Срочные задачи' };
    document.getElementById('tasksLabel').textContent = labels[f];
    renderTasks();
  }

  // ==========================================
  // TASK ACTIONS
  // ==========================================
  async function toggleDone(event, id) {
    event.stopPropagation();
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const newStatus = task.status === 'done' ? 'todo' : 'done';
    task.status = newStatus;
    renderTasks();
    updateStats();
    await apiCall('PATCH', `/tasks/${id}`, { status: newStatus, user_id: userId });
  }

  async function saveTask() {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) { showToast('Введи название задачи', 'error'); return; }

    const taskData = {
      title,
      description: document.getElementById('taskDesc').value.trim(),
      status: document.getElementById('taskStatus').value,
      priority: document.getElementById('taskPriority').value,
      deadline: document.getElementById('taskDeadline').value,
      assignee: document.getElementById('taskAssignee').value.trim(),
      user_id: userId,
      user_name: userName,
    };

    if (editingId) {
      await apiCall('PATCH', `/tasks/${editingId}`, taskData);
      const idx = tasks.findIndex(t => t.id === editingId);
      if (idx !== -1) tasks[idx] = { ...tasks[idx], ...taskData };
      showToast('✓ Задача обновлена', 'success');
    } else {
      const res = await apiCall('POST', '/tasks', taskData);
      if (res && res.task) tasks.unshift(res.task);
      showToast('✓ Задача добавлена', 'success');
    }

    renderTasks();
    updateStats();
    closeModal();
    if (tg) tg.HapticFeedback?.notificationOccurred('success');
  }

  async function deleteTask() {
    if (!editingId) return;
    await apiCall('DELETE', `/tasks/${editingId}`, { user_id: userId });
    tasks = tasks.filter(t => t.id !== editingId);
    renderTasks();
    updateStats();
    closeModal();
    showToast('Задача удалена', 'error');
  }

  // ==========================================
  // MODAL
  // ==========================================
  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Новая задача';
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskDesc').value = '';
    document.getElementById('taskStatus').value = 'todo';
    document.getElementById('taskPriority').value = 'medium';
    document.getElementById('taskDeadline').value = '';
    document.getElementById('taskAssignee').value = '';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('taskModal').classList.add('open');
    setTimeout(() => document.getElementById('taskTitle').focus(), 400);
    if (tg) tg.HapticFeedback?.impactOccurred('light');
  }

  function openEditModal(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Редактировать';
    document.getElementById('taskTitle').value = task.title;
    document.getElementById('taskDesc').value = task.description || '';
    document.getElementById('taskStatus').value = task.status;
    document.getElementById('taskPriority').value = task.priority;
    document.getElementById('taskDeadline').value = task.deadline || '';
    document.getElementById('taskAssignee').value = task.assignee || '';
    document.getElementById('deleteBtn').style.display = 'block';
    document.getElementById('taskModal').classList.add('open');
    if (tg) tg.HapticFeedback?.impactOccurred('light');
  }

  function closeModal() {
    document.getElementById('taskModal').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('taskModal')) closeModal();
  }

  // ==========================================
  // UTILS
  // ==========================================
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ==========================================
  // DEMO DATA (когда нет сервера)
  // ==========================================
  function loadDemoData() {
    tasks = [
      { id: '1', title: 'Настроить Telegram Bot', description: 'Создать бота через @BotFather', status: 'done', priority: 'high', deadline: '2024-01-10', assignee: '@admin' },
      { id: '2', title: 'Подключить Google Sheets API', description: 'Создать Service Account и выдать доступ', status: 'doing', priority: 'high', deadline: new Date(Date.now() + 2*24*60*60*1000).toISOString().split('T')[0], assignee: '@dev' },
      { id: '3', title: 'Задеплоить бэкенд на сервер', description: 'Использовать Railway или Render', status: 'todo', priority: 'medium', deadline: new Date(Date.now() + 5*24*60*60*1000).toISOString().split('T')[0], assignee: '' },
      { id: '4', title: 'Проверить уведомления', description: 'Тест ежедневных напоминаний', status: 'todo', priority: 'low', deadline: '', assignee: '' },
    ];
    renderTasks();
    updateStats();
  }

  // ==========================================
  // INIT
  // ==========================================
  async function init() {
    // Попробуй загрузить с сервера, иначе — демо
    if (CONFIG.API_URL !== 'https://YOUR_SERVER_URL') {
      await loadTasks();
    } else {
      loadDemoData();
    }
    document.getElementById('loading').classList.add('hidden');

    // Автообновление
    setInterval(loadTasks, CONFIG.POLL_INTERVAL);
  }

  window.addEventListener('load', init);

  // Keyboard shortcut — закрыть по Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
